<!DOCTYPE html>
<html>
<head>
  <title>Student Portal</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background: linear-gradient(135deg,#1e3c72,#2a5298);
      color:white;
    }

    /* TOPBAR */
    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:rgba(0,0,0,0.4);
    }

    .menu-btn {
      font-size:24px;
      cursor:pointer;
    }

    /* MENU */
    .menu {
      position:fixed;
      left:-250px;
      top:0;
      width:250px;
      height:100%;
      background:rgba(0,0,0,0.9);
      padding:20px;
      transition:0.3s;
    }

    .menu.active { left:0; }

    .menu button {
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      background:#00c6ff;
      color:white;
    }

    /* PROFILE */
    #profile img {
      border-radius:50%;
      cursor:pointer;
    }

    #profileMenu {
      display:none;
      position:absolute;
      right:20px;
      top:60px;
      background:white;
      color:black;
      padding:15px;
      border-radius:10px;
    }

    /* MAIN */
    .main { padding:20px; }

    .card {
      background:rgba(255,255,255,0.1);
      padding:15px;
      margin-top:10px;
      border-radius:10px;
    }

    .section { display:none; }
    .active { display:block; }

  </style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="menu">
  <h2>Menu</h2>
  <button onclick="show('doubt')">❓ Doubts</button>
  <button onclick="show('notes')">📂 Notes</button>
  <button onclick="show('admin')">⚙️ Admin</button>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <span>🎓 Student Portal</span>

  <div id="profileBox">
    <button onclick="login()" id="loginBtn">Login</button>

    <div id="profile" style="display:none;" onclick="toggleProfile()">
      <img id="profilePic" width="35">
    </div>
  </div>
</div>

<!-- PROFILE MENU -->
<div id="profileMenu">
  <img id="menuPic" width="60">
  <p id="menuName"></p>
  <p id="menuEmail"></p>
  <button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

  <div id="doubt" class="section active">
    <h2>Doubts</h2>
    <input id="doubtInput" placeholder="Ask doubt">
    <button onclick="addDoubt()">Post</button>
    <div id="doubtList"></div>
  </div>

  <div id="notes" class="section">
    <h2>Notes</h2>

    <select id="subject">
      <option>Maths</option>
      <option>Physics</option>
      <option>Chemistry</option>
    </select>

    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>

    <div id="filesList"></div>
  </div>

  <div id="admin" class="section">
    <h2>Admin Panel</h2>
    <button onclick="clearDoubts()">Delete Doubts</button>
    <button onclick="clearNotes()">Delete Notes</button>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0sVeQZeXyXJZhynmkS5ndML2SpbEbrOk",
  authDomain: "student-portal-8acee.firebaseapp.com",
  projectId: "student-portal-8acee",
  storageBucket: "student-portal-8acee.appspot.com",
  messagingSenderId: "319905377108",
  appId: "1:319905377108:web:5363e53a0236ae20f136c1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser=null;
const ADMIN_EMAIL="yourgmail@gmail.com";

// MENU
function toggleMenu(){
  menu.classList.toggle("active");
}

// LOGIN
function login(){
  let provider=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithRedirect(provider);
}

// AUTH
firebase.auth().onAuthStateChanged(user=>{
  if(user){
    currentUser=user;

    loginBtn.style.display="none";
    profile.style.display="block";

    profilePic.src=user.photoURL;
    menuPic.src=user.photoURL;

    menuName.innerText=user.displayName;
    menuEmail.innerText=user.email;

    if(user.email!==ADMIN_EMAIL){
      document.getElementById("admin").style.display="none";
    }
  }
});

// PROFILE MENU
function toggleProfile(){
  profileMenu.style.display =
    profileMenu.style.display==="none"?"block":"none";
}

function logout(){
  firebase.auth().signOut();
  location.reload();
}

// NAV
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  toggleMenu();
}

// DOUBTS
function addDoubt(){
  let text=doubtInput.value;
  if(!text)return;

  db.collection("doubts").add({
    text,
    user: currentUser?currentUser.displayName:"Anonymous",
    time:new Date(),
    likes:0
  });

  doubtInput.value="";
}

db.collection("doubts").orderBy("time","desc")
.onSnapshot(snap=>{
  doubtList.innerHTML="";

  snap.forEach(doc=>{
    let d=doc.data();

    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <b>${d.user}</b>: ${d.text}<br>
      👍 ${d.likes}
      <button onclick="like('${doc.id}')">Like</button>

      <br>
      <input id="r-${doc.id}" placeholder="Reply">
      <button onclick="reply('${doc.id}')">Reply</button>
      <div id="rep-${doc.id}"></div>
    `;

    doubtList.appendChild(div);

    db.collection("doubts").doc(doc.id)
    .collection("replies").orderBy("time")
    .onSnapshot(rSnap=>{
      let rDiv=document.getElementById("rep-"+doc.id);
      rDiv.innerHTML="";
      rSnap.forEach(r=>{
        let p=document.createElement("p");
        let data=r.data();
        p.innerText=data.user+": "+data.text;
        rDiv.appendChild(p);
      });
    });

  });
});

function like(id){
  db.collection("doubts").doc(id).update({
    likes:firebase.firestore.FieldValue.increment(1)
  });
}

function reply(id){
  let text=document.getElementById("r-"+id).value;

  db.collection("doubts").doc(id)
  .collection("replies").add({
    text,
    user: currentUser?currentUser.displayName:"Anonymous",
    time:new Date()
  });

  document.getElementById("r-"+id).value="";
}

// NOTES
function uploadFile(){
  let file=fileInput.files[0];
  let subject=subject.value;

  let ref=storage.ref("notes/"+subject+"/"+file.name);

  ref.put(file).then(()=>{
    ref.getDownloadURL().then(url=>{
      db.collection("notes").add({
        name:file.name,
        url,
        subject
      });
    });
  });
}

db.collection("notes").onSnapshot(snap=>{
  filesList.innerHTML="";
  let group={};

  snap.forEach(doc=>{
    let d=doc.data();
    if(!group[d.subject]) group[d.subject]=[];
    group[d.subject].push(d);
  });

  for(let s in group){
    let h=document.createElement("h3");
    h.innerText=s;
    filesList.appendChild(h);

    group[s].forEach(f=>{
      let a=document.createElement("a");
      a.href=f.url;
      a.innerText=f.name;
      a.target="_blank";
      filesList.appendChild(a);
      filesList.appendChild(document.createElement("br"));
    });
  }
});

// ADMIN
function clearDoubts(){
  db.collection("doubts").get().then(snap=>{
    snap.forEach(doc=>doc.ref.delete());
  });
}

function clearNotes(){
  db.collection("notes").get().then(snap=>{
    snap.forEach(doc=>doc.ref.delete());
  });
}
</script>

</body>
</html>
